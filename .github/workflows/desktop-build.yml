name: Desktop build

# Technical (unsigned / ad-hoc signed) installers for macOS and Windows.
# Production signing and notarization stay a separate, manual release gate —
# see docs/RELEASE_CHECKLIST.md.
#
# A vX.Y.Z tag also builds signed in-app update packages and publishes a
# draft release with latest.json to the public installers-only repository
# (see docs/UPDATES.md). It needs the TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD and EASYWAR_RELEASES_TOKEN secrets.
#
# Actions minutes on this private repository are limited, and macOS and Windows
# minutes count 10x and 2x. Pull requests and pushes to main therefore run only
# the Linux checks (Rust fmt/clippy/tests, JS tests, build, dependency audit).
# The macOS and Windows builds (including the launch smoke test) run on release
# tags, where they gate the draft release, and on demand via "Run workflow".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Weekly run so a new advisory against an unchanged lockfile is noticed (audit job).
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the resolved tag commits from CI logs);
# the trailing comment names the release line the SHA belongs to.

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # Installers and update packages only; the source stays in this private repo.
  RELEASES_REPO: hellwikcoop-arch/easywar-releases

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Check version numbers
        run: node script/release_version.mjs
      - name: Check update signing configuration
        if: env.RELEASE_BUILD == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          EASYWAR_RELEASES_TOKEN: ${{ secrets.EASYWAR_RELEASES_TOKEN }}
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD EASYWAR_RELEASES_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Для випуску з оновленнями потрібен секрет $name (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          if [ -n "$EASYWAR_RELEASES_TOKEN" ] && ! GH_TOKEN="$EASYWAR_RELEASES_TOKEN" gh api "repos/$RELEASES_REPO" --jq '.private == false and .permissions.push == true' | grep -qx true; then
            echo "::error::Репозиторій $RELEASES_REPO має бути публічним, а EASYWAR_RELEASES_TOKEN — мати в ньому право запису (Contents: Read and write)."
            missing=1
          fi
          exit $missing
      # Tauri embeds ../dist at compile time. The Rust gates need only a placeholder
      # (the real frontend is built by the last step), so they stay fast.
      - name: Placeholder frontend for the Rust checks
        run: |
          mkdir -p dist
          echo '<!doctype html><title>EasyWAR</title>' > dist/index.html
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # The XLSX contract test runs a Rust example against the legacy parser.
      - run: npm run test:unit
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: audit
      # Production dependencies only; the lockfile is enough, nothing is installed.
      # Documented, currently unfixable advisories are listed with a reason in
      # script/npm_audit_gate.mjs; anything else fails.
      - name: npm audit (production dependencies)
        run: node script/npm_audit_gate.mjs
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
      # Ignored advisories, each with a reason, live in .cargo/audit.toml.
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

  macos:
    needs: [checks, audit]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The language-model runner (runner/, a thin wrapper over llama.cpp) travels in the
      # installer as a Tauri sidecar. It is built before the app and checked on its own.
      - name: Build the language-model runner (universal)
        run: script/build_runner.sh universal-apple-darwin
      - name: Runner protocol smoke test
        run: script/runner_smoke.sh src-tauri/binaries/easywar-llm-runner-universal-apple-darwin
      - name: Build universal app and DMG (ad-hoc signature)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE_BUILD == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE_BUILD == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          EASYWAR_UPDATE_ENDPOINT: ${{ env.RELEASE_BUILD == 'true' && format('https://github.com/{0}/releases/latest/download/latest.json', env.RELEASES_REPO) || '' }}
        # `tauri build` accepts --config more than once and merges the files in order.
        run: |
          updater=()
          if [ "$RELEASE_BUILD" = true ]; then updater=(--config src-tauri/tauri.updater.conf.json); fi
          npm run tauri build -- --target universal-apple-darwin --config src-tauri/tauri.adhoc.conf.json --config src-tauri/tauri.runner.conf.json "${updater[@]}"
      - name: Verify bundle
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/EasyWAR.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The runner inside the signed bundle must still start and answer.
          script/runner_smoke.sh "$APP/Contents/MacOS/easywar-llm-runner"
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
            shasum -a 256 "$dmg"
          done
      - name: Smoke-test app launch and restart
        run: |
          BIN=src-tauri/target/universal-apple-darwin/release/bundle/macos/EasyWAR.app/Contents/MacOS/easywar
          DATA="$HOME/Library/Application Support/com.hellwikcoop.easywar"
          launch() {
            LOG="$RUNNER_TEMP/easywar-$1.log"
            RUST_BACKTRACE=1 "$BIN" >"$LOG" 2>&1 &
            PID=$!
            sleep 20
            if kill -0 "$PID" 2>/dev/null; then
              echo "$1: EasyWAR is still running after 20 s."
              kill "$PID"
              wait "$PID" 2>/dev/null || true
              cat "$LOG"
              return 0
            fi
            STATUS=0
            wait "$PID" || STATUS=$?
            echo "::error::EasyWAR exited during startup ($1, status $STATUS)."
            cat "$LOG"
            for report in ~/Library/Logs/DiagnosticReports/easywar* ~/Library/Logs/DiagnosticReports/EasyWAR*; do
              if [ -f "$report" ]; then
                echo "--- $report"
                head -150 "$report"
              fi
            done
            return 1
          }
          launch first-start
          # A process killed mid-write leaves a journal next to the database;
          # the next start must let SQLite recover it instead of refusing to open.
          python3 -c 'import sys; open(sys.argv[1], "wb").write(bytes(512) + b"Z" * 4096)' "$DATA/easywar.db-journal"
          launch after-interrupted-write
          test ! -e "$DATA/easywar.db-journal"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EasyWAR-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload signed update package
        if: env.RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EasyWAR-macOS-update
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/EasyWAR.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/EasyWAR.app.tar.gz.sig
          if-no-files-found: error

  windows:
    needs: [checks, audit]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the language-model runner
        shell: bash
        run: script/build_runner.sh x86_64-pc-windows-msvc
      - name: Runner protocol smoke test
        shell: bash
        run: script/runner_smoke.sh src-tauri/binaries/easywar-llm-runner-x86_64-pc-windows-msvc.exe
      - name: Build MSI and NSIS installers (unsigned)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE_BUILD == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE_BUILD == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          EASYWAR_UPDATE_ENDPOINT: ${{ env.RELEASE_BUILD == 'true' && format('https://github.com/{0}/releases/latest/download/latest.json', env.RELEASES_REPO) || '' }}
        run: |
          updater=()
          if [ "$RELEASE_BUILD" = true ]; then updater=(--config src-tauri/tauri.updater.conf.json); fi
          npm run tauri build -- --config src-tauri/tauri.runner.conf.json "${updater[@]}"
      - name: The runner is packed with the application
        shell: bash
        run: script/runner_smoke.sh src-tauri/target/release/easywar-llm-runner.exe
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/nsis/*.exe |
            Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EasyWAR-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect installers and update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in EasyWAR-macOS EasyWAR-macOS-update EasyWAR-Windows; do
            gh run download "$GITHUB_RUN_ID" --name "$name" --dir "release/$name"
          done
          find release -type f | sort
      - name: Build latest.json
        run: |
          shopt -s failglob
          notes=()
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md"); fi
          node script/update_manifest.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --files-url "https://github.com/$RELEASES_REPO/releases/download/{tag}/" \
            --mac-archive release/EasyWAR-macOS-update/EasyWAR.app.tar.gz \
            --windows-nsis release/EasyWAR-Windows/nsis/*.exe \
            --windows-msi release/EasyWAR-Windows/msi/*.msi \
            "${notes[@]}" \
            --out release/latest.json
          cat release/latest.json
      # A release needs a commit to point at; give an empty repository one.
      - name: Initialise the installers repository if it is empty
        env:
          GH_TOKEN: ${{ secrets.EASYWAR_RELEASES_TOKEN }}
        run: |
          if gh api "repos/$RELEASES_REPO/commits?per_page=1" --silent 2>/dev/null; then
            exit 0
          fi
          printf '%s\n' \
            '# EasyWAR — інсталятори' \
            '' \
            'Тут лише готові інсталятори та пакети оновлення EasyWAR для macOS і Windows.' \
            'Коду й даних у цьому репозиторії немає.' \
            '' \
            'Остання версія: [Releases → Latest](../../releases/latest).' \
            '' \
            'Встановлені копії оновлюються з самого застосунку: «Резервна копія» →' \
            '«Перевірити оновлення». Кожен пакет підписаний ключем EasyWAR і' \
            'перевіряється перед встановленням.' > README.md
          gh api -X PUT "repos/$RELEASES_REPO/contents/README.md" \
            -f message="Add README" -f content="$(base64 -w0 README.md)" --silent
      # A draft is invisible to the updater; publishing it (one click on
      # GitHub) is what makes installed copies offer the new version.
      - name: Create draft release in the public installers repository
        env:
          GH_TOKEN: ${{ secrets.EASYWAR_RELEASES_TOKEN }}
        run: |
          shopt -s failglob
          gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft \
            --title "EasyWAR ${GITHUB_REF_NAME#v}" \
            --notes "Технічна збірка EasyWAR ${GITHUB_REF_NAME#v}: macOS з ad-hoc підписом (без Developer ID і нотаризації), Windows без підпису Authenticode. Перше встановлення покаже попередження Gatekeeper/SmartScreen. Пакети оновлення підписані ключем EasyWAR і перевіряються застосунком. Встановлені копії оновлюються через «Резервна копія» → «Перевірити оновлення». Публікація — лише за письмовим рішенням-винятком (docs/UPDATES.md)." \
            release/latest.json \
            release/EasyWAR-macOS/*.dmg \
            release/EasyWAR-macOS-update/EasyWAR.app.tar.gz \
            release/EasyWAR-macOS-update/EasyWAR.app.tar.gz.sig \
            release/EasyWAR-Windows/nsis/* \
            release/EasyWAR-Windows/msi/*
