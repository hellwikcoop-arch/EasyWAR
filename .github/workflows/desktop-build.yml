name: Desktop build

# Technical (unsigned / ad-hoc signed) installers for macOS and Windows.
# Production signing and notarization stay a separate, manual release gate —
# see docs/RELEASE_CHECKLIST.md.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the resolved tag commits from CI logs);
# the trailing comment names the release line the SHA belongs to.

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The XLSX contract test runs a Rust example against the legacy parser.
      - run: npm run test:unit
      - run: npm run build

  macos:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build universal app and DMG (ad-hoc signature)
        run: npm run tauri build -- --target universal-apple-darwin --config src-tauri/tauri.adhoc.conf.json
      - name: Verify bundle
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/EasyWAR.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
            shasum -a 256 "$dmg"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EasyWAR-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build MSI and NSIS installers (unsigned)
        run: npm run tauri build
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/nsis/*.exe |
            Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EasyWAR-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
