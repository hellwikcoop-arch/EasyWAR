[package]
name = "easywar"
version = "2.3.0"
description = "Local-first EasyWAR desktop shell"
authors = ["EasyWAR contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "easywar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
calamine = { version = "=0.26.1", features = ["dates"] }
# Захищена бібліотека «Офісу»: AEAD для вмісту й обгорток ключа, HKDF-підключі, HMAC ідентифікаторів.
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
fs2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
quick-xml = "=0.31.0"
regex = "=1.13.1"
# Нативні повідомлення до створення вікна. З 0.17 бекенд на Linux треба вказати самим (gtk3):
# tauri-plugin-dialog тягне власну rfd 0.16 і для цієї копії бекенд не вмикає.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
zeroize = "1"
tauri-plugin-updater = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
spake2 = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
