[package]
name = "easywar"
version = "1.0.6"
description = "Local-first EasyWAR desktop shell"
authors = ["EasyWAR contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "easywar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
calamine = { version = "=0.26.1", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
fs2 = "0.4"
quick-xml = "=0.31.0"
regex = "=1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
