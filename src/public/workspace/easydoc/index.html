<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>EasyDoc</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Ідентифікатори canvas і повідомлення про завантаження задає сама збірка WordCraft. -->
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Завантаження EasyDoc…</div>
  <script src="./easydoc-host.js"></script>
  <script type="module">
    import init from './wordcraft-web.js';
    init({ module_or_path: new URL('./wordcraft-web_bg.wasm', import.meta.url) }).catch((error) => {
      const box = document.getElementById('wordcraft_loading');
      if (box) box.textContent = 'EasyDoc не запустився: ' + error;
    });
  </script>
</body>
</html>
