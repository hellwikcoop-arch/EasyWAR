<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EasyWAR — перегляд</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./pwa-192.png">
<link rel="apple-touch-icon" href="./pwa-192.png">
<style>
:root{--bg:#06101c;--ink:#e6eef7;--muted:#8fa3bf;--line:#1b2c47;--blue:#3d9bff;--red:#e85d46}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh}
#home{min-height:100dvh;display:grid;align-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#06101c 0,rgba(6,16,28,.55) 30%,rgba(6,16,28,.8) 100%),url('./launcher-bg.webp') center top/cover no-repeat,var(--bg)}
h1{margin:0;text-align:center;font-size:26px;letter-spacing:.02em}
.sub{margin:0;text-align:center;color:var(--muted);font-size:14px}
.tiles{display:grid;gap:12px;max-width:460px;width:100%;margin:0 auto}
.tile{appearance:none;display:grid;gap:4px;text-align:left;padding:16px 18px;border:1px solid var(--line);border-radius:14px;color:inherit;font:inherit;cursor:pointer;
  background:linear-gradient(180deg,rgba(19,36,55,.92),rgba(11,24,37,.96));box-shadow:0 10px 26px rgba(0,0,0,.35)}
.tile[data-cmd=pvk]{--a:var(--blue)}.tile[data-cmd=dshv]{--a:var(--red)}
.tile:active,.tile:hover{border-color:var(--a)}
.tile b{font-size:17px;color:var(--a)}
.tile span{color:var(--muted);font-size:14px}
.note{max-width:460px;margin:0 auto;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.45;background:rgba(6,16,28,.7)}
#stage{position:fixed;inset:0;display:none;background:var(--bg)}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#back{position:fixed;z-index:5;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:none;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(6,16,28,.92);color:var(--ink);font:600 14px system-ui,sans-serif}
body.open #stage,body.open #back{display:block}
body.open #home{display:none}
</style>
</head>
<body>
<main id="home">
  <h1>easyWAR</h1>
  <p class="sub">Перегляд дашбордів на телефоні</p>
  <div class="tiles">
    <button class="tile" type="button" data-cmd="pvk"><b>Повітряне командування</b><span>Дашборд ПВК · відкрити таблицю з пристрою</span></button>
    <button class="tile" type="button" data-cmd="dshv"><b>Командування ДШВ</b><span>Дашборд УДШВ · відкрити таблицю з пристрою</span></button>
  </div>
  <p class="note">Лише перегляд. Таблиця відкривається на вашому пристрої й нікуди не надсилається. Після першого завантаження застосунок працює без інтернету. Щоб мати іконку на екрані, оберіть у браузері «Додати на головний екран».</p>
</main>
<div id="stage"><iframe id="frame" title="Дашборд"></iframe></div>
<button id="back" type="button" hidden>← Назад</button>
<script>
(function () {
  var SRC = { pvk: './air.html?command=pvk&viewer=1', dshv: './rocket.html?command=dshv&viewer=1' };
  var frame = document.getElementById('frame'), back = document.getElementById('back');
  function open(cmd) { if (frame.getAttribute('data-cmd') !== cmd) { frame.src = SRC[cmd]; frame.setAttribute('data-cmd', cmd); } document.body.classList.add('open'); back.hidden = false; }
  function close() { document.body.classList.remove('open'); back.hidden = true; }
  document.querySelectorAll('.tile').forEach(function (t) { t.addEventListener('click', function () { open(t.dataset.cmd); }); });
  back.addEventListener('click', close);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
