<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Робоче середовище — EasyWAR</title>
<link rel="stylesheet" href="./workspace.css">
</head>
<body>
<section class="ws-screen" id="ws-home" aria-label="Робоче середовище">
  <header class="ws-topbar ws-topbar-home">
    <span class="ws-topbar-title">РОБОЧЕ СЕРЕДОВИЩЕ</span>
    <button type="button" class="ws-button ws-button-quiet" id="ws-exit">← На стартову</button>
  </header>
  <main class="ws-home-main" id="ws-sections"></main>
</section>
<section class="ws-workspace" id="ws-app" hidden aria-labelledby="ws-app-name">
  <header class="ws-topbar ws-appbar">
    <button type="button" class="ws-button ws-button-quiet" id="ws-back">← Розділи</button>
    <span class="ws-appbar-separator" aria-hidden="true"></span>
    <span class="ws-appbar-icon" id="ws-app-icon"></span>
    <div class="ws-appbar-label">
      <span class="ws-appbar-name" id="ws-app-name"></span>
      <span class="ws-filename" id="ws-app-file" hidden></span>
      <span class="ws-dirty-dot" id="ws-app-dirty" role="img" aria-label="Є незбережені зміни" hidden>•</span>
    </div>
    <button type="button" class="ws-button ws-button-quiet ws-close-button" id="ws-close">Закрити</button>
  </header>
  <div class="ws-confirm" id="ws-confirm" role="region" aria-live="assertive" aria-labelledby="ws-confirm-title" aria-describedby="ws-confirm-desc" hidden>
    <span class="ws-confirm-icon" aria-hidden="true">!</span>
    <div class="ws-confirm-copy"><strong id="ws-confirm-title">Є незбережені зміни.</strong><span id="ws-confirm-desc">Закрити без збереження?</span></div>
    <div class="ws-confirm-actions">
      <button type="button" class="ws-button" data-confirm="stay">Залишитися</button>
      <button type="button" class="ws-button ws-button-danger" data-confirm="leave">Закрити без збереження</button>
    </div>
  </div>
  <iframe class="ws-frame" id="ws-frame" title="Застосунок робочого середовища"></iframe>
</section>
<script type="module" src="./workspace.js"></script>
</body>
</html>
