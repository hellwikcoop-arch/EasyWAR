<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyGreen</title>
  <style>html, body { margin: 0; height: 100%; background: #111214; } #easygreen { height: 100%; }</style>
</head>
<body>
  <!-- EasyGreen окремою сторінкою (прототип): оболонка «Робоче середовище» може вбудувати її в iframe
       або змонтувати панель сама через mountEasyGreen із easygreen-panel.js. -->
  <main id="easygreen"></main>
  <script type="module">
    import { mountEasyGreen } from './easygreen-panel.js';
    mountEasyGreen(document.getElementById('easygreen'), { appUrl: 'app/index.html' });
  </script>
</body>
</html>
