<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>EasySlide</title>
  <!-- Прототип. Редактор — веб-збірка DeckCraft (MIT OR Apache-2.0), див. vendor/README.md. -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #deckcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #deckcraft_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; text-align: center; padding: 24px; }
    #easyslide_status { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); max-width: 80%;
      background: #1f2937; color: #f3f4f6; font: 13px system-ui, sans-serif; padding: 8px 14px; border-radius: 6px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .4); }
  </style>
</head>
<body>
  <canvas id="deckcraft_canvas"></canvas>
  <div id="deckcraft_loading">Завантаження EasySlide…</div>
  <div id="easyslide_status" role="status" hidden></div>
  <script type="module" src="./host.js"></script>
</body>
</html>
