# Налаштування `cargo audit` (CI, job `audit`; запуск з кореня репозиторію:
# `cargo audit --file src-tauri/Cargo.lock`). Кожен виняток має причину й посилання на
# беклог; коли виправлення стає доступним, запис видаляють (docs/WORKFLOW.md, розділ 5).
# Попередження про непідтримувані крейти (gtk3, unic-*, proc-macro-error — залежності
# Tauri на Linux) не блокують CI: це не вразливості.

[advisories]
ignore = [
  # rsa (атака Marvin): приходить лише з sqlx-mysql у Cargo.lock і не компілюється
  # (`cargo tree -i rsa` порожній), бо застосунок використовує тільки SQLite.
  "RUSTSEC-2023-0071",

  # quick-xml 0.31.0 (закріплений `=0.31.0` разом з calamine 0.26): квадратичний час при
  # перевірці дублікатів атрибутів і необмежена пам'ять в NsReader. Це відмова в обслуговуванні
  # на навмисно сконструйованому XLSX, який користувач сам відкриває. Виправлення — quick-xml
  # >= 0.41 разом із calamine 0.36: беклог P2-5.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",

  # zip 2.4.2 приходить лише з calamine 0.26.1 (власна залежність і tauri-plugin-updater
  # уже на zip 9): вразливості лише в `ZipArchive::extract` / `ZipStreamReader::extract`,
  # яких calamine не викликає (XLSX читається через by_name/read). Зникне разом з
  # оновленням calamine: беклог P2-5.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",

  # calamine 0.26.1: паніка й необмежена пам'ять у парсері CFB/OLE2 (формат .xls).
  # Застосунок відкриває лише XLSX (`calamine::Xlsx`), парсер CFB не викликається.
  # Виправлення — calamine >= 0.38, але 0.38 обрізає пробіли в rich-run без
  # xml:space="preserve" і ламає tests/xlsx-legacy-contract.test.mjs: беклог P2-5.
  "RUSTSEC-2026-0436",

  # libsqlite3-sys 0.30.1 (через sqlx-sqlite 0.8 і tauri-plugin-sql): CVE-2026-119375 у
  # вбудованому C SQLite. Виправлення — libsqlite3-sys >= 0.39, але sqlx 0.8 вимагає ^0.30.1,
  # а sqlx 0.9 — < 0.38, тож оновити без зміни sqlx неможливо. База локальна, SQL-запити
  # формує лише застосунок; прибрати запис, щойно sqlx дозволить libsqlite3-sys >= 0.39.
  # Беклог P2-13.
  "RUSTSEC-2026-0459",
]
